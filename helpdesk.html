<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="CWA Help Desk Appointment">
        <meta name="keywords" content="CWA, Help Desk, Appointment">
        <meta name="author" content="Hui Xin">
        <title>CWA Help Desk Appointment</title>
    </head>
    <body>

        <form method="post">

        <a href="http://www.swin.edu.au">
            <img src="images/logo.png" alt="Swinburne University of Technology">
        </a>
        <h1>CWA Help Desk Appointment</h1>
        <p>The Help Desk is located in ATC620. Open 10.30 to 19.00 Monday to Friday.</p>
        <p>Check Blackboard for when CWA tutors will be there.</p>
        
        <fieldset>
            <legend>Student details</legend>

            <label for="studentid">Student ID</label>
            <input type="text" name="studentid" id="studentid" required="required" pattern="[0-9]{7,10}">

            <br><br>

            <label for="givenname">Given Name</label>
            <input type="text" name="givenname" id="givenname" required="required" maxlength="15" pattern="[A-Za-z]+">

            <label for="familyname">Family Name</label>
            <input type="text" name="familyname" id="familyname" required="required" maxlength="15" pattern="[A-Za-z]+">

        </fieldset>

        <fieldset>

            <legend>Your unit</legend>

            <input type="radio" id="cos10011" name="unit" value="COS10011" required="required">
            <label for="cos10011">COS10011</label>

            <input type="radio" id="cos60004" name="unit" value="COS60004">
            <label for="cos60004">COS60004</label>

            <input type="radio" id="cos60007" name="unit" value="COS60007">
            <label for="cos60007">COS60007</label>

            <br><br>
            <label for="tutor">Your tutor</label>   
            <select name="tutor" id="tutor" required="required">
                <option value="">Please Select</option>
                <option value="angeline">Ms Angeline</option>
                <option value="david">Mr David</option>
                <option value="sarah">Ms Sarah</option>
            </select>

        </fieldset>

        <fieldset>
            <legend>Issue</legend>

            <input type="checkbox" id="html" name="issue[]" value="HTML" checked="checked">
            <label for="html">HTML</label>

            <input type="checkbox" id="css" name="issue[]" value="CSS">
            <label for="css">CSS</label>

            <input type="checkbox" id="javascript" name="issue[]" value="JavaScript">
            <label for="javascript">Javascript</label>
            
            <input type="checkbox" id="php" name="issue[]" value="PHP">
            <label for="php">PHP</label>

            <input type="checkbox" id="mysql" name="issue[]" value="MySQL">
            <label for="mysql">MySQL</label>

            <br><br>

            <label for="description">Description of Issue</label>
            <br>
            <textarea id="description" name="description" rows="4" cols="40" placeholder="Write a description of your problem here..."></textarea>

        </fieldset>

        <fieldset>
            <legend>Preferred Date / Time</legend>

            <label for="date">Date</label>
            <input type="text" name="date" id="date" placeholder="dd/mm/yyyy" pattern="[0-9]{2}/[0-9]{2}/[0-9]{4}">

            <br><br>

            <label for="time">Time</label>
            <input type="text" name="time" id="time" placeholder="00:00" pattern="[0-9]{2}:[0-9]{2}">

        </fieldset>

        <input type="submit" value="Book">
        <input type="reset" value="Reset form">


        </form>

    </body>
</html>
